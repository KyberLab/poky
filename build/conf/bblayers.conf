# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS ?= " \
  /ws/build/Yocto/meta \
  /ws/build/Yocto/meta-poky \
  /ws/build/Yocto/meta-yocto-bsp \
  /ws/build/Yocto/meta-openembedded/meta-oe \
  /ws/build/Yocto/meta-openembedded/meta-filesystems \
  /ws/build/Yocto/meta-openembedded/meta-python \
  /ws/build/Yocto/meta-openembedded/meta-networking \
  /ws/build/Yocto/meta-games \
  /ws/build/Yocto/meta-virtualization \
  "

INHERIT += "externalsrc"
EXTERNALSRC_pn-xen = "/ws/build/Xen"
EXTERNALSRC_BUILD_pn-xen = "/ws/build/Xen"
